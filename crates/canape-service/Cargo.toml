[package]
name = "canape-service"
description = "Privileged background service: hardware, auto TDP, IPC server"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
canape-core.workspace = true
canape-hw.workspace = true
canape-autotdp.workspace = true
canape-ipc.workspace = true
# Pure parsers for the game folders (Steam libraries, Epic manifests).
canape-library = { path = "../canape-library" }
serde.workspace = true
serde_json.workspace = true

[target.'cfg(windows)'.dependencies]
windows-service.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authorization",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_Power",
    "Win32_System_Registry",
    "Win32_System_RemoteDesktop",
    "Win32_System_Services",
    "Win32_System_Threading",
] }
