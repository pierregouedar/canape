[package]
name = "canape-shell"
description = "Full-screen experience (FSE) home app"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true

[dependencies]
canape-core.workspace = true
canape-ipc.workspace = true
canape-library = { path = "../canape-library" }
serde.workspace = true
serde_json.workspace = true
slint = { version = "1.18", default-features = false, features = ["std", "compat-1-2", "backend-winit", "renderer-software", "software-renderer-path", "software-renderer-systemfonts"] }

[target.'cfg(windows)'.dependencies]
canape-hw.workspace = true
windows-sys = { workspace = true, features = [
    "Win32_Foundation",
    "Win32_Globalization",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_UI_Input_XboxController",
    "Win32_UI_WindowsAndMessaging",
] }

[target.'cfg(target_os = "linux")'.dependencies]
slint = { version = "1.18", default-features = false, features = ["backend-winit-x11"] }

[features]
# Test builds only: adds the GPU renderers next to the software one, picked
# at launch with CANAPE_RENDERER, to measure them on the device.
gpu-renderers = ["slint/renderer-femtovg", "slint/renderer-femtovg-wgpu", "slint/unstable-wgpu-30"]

[build-dependencies]
slint-build = "1.18"
