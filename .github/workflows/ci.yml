name: CI

on:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Release binaries built here, since Smart App Control on the Ally
      # blocks fresh build scripts (see docs/m2-report.md).
      - run: cargo build --release -p canape-shell -p canape-service -p canape-ctl
      # The GPU executable is built apart, without the software renderer.
      - run: cargo build --release -p canape-shell --no-default-features --features gpu
      - uses: actions/upload-artifact@v4
        with:
          name: canape-windows-x64
          path: |
            target/release/canape-shell.exe
            target/release/canape-shell-gpu.exe
            target/release/canape-service.exe
            target/release/canape-ctl.exe

  widget:
    runs-on: windows-2022
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned UWP widget
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $msbuild = & $vswhere -latest -products * -requires Microsoft.Component.MSBuild -find "MSBuild\**\Bin\MSBuild.exe" | Select-Object -First 1
          if (-not $msbuild) { throw "MSBuild not found" }
          $out = Join-Path $env:GITHUB_WORKSPACE "target\widget"
          & $msbuild widget\CanapeWidget\CanapeWidget.csproj /restore /p:Configuration=Release /p:Platform=x64 /p:UapAppxPackageBuildMode=SideloadOnly /p:AppxBundle=Never /p:AppxPackageSigningEnabled=false "/p:AppxPackageDir=$out\"
          if ($LASTEXITCODE -ne 0) { throw "Widget build failed ($LASTEXITCODE)" }
          if (-not (Get-ChildItem $out -Recurse -File -Include *.appx,*.msix | Where-Object { $_.FullName -notmatch '\\Dependencies\\' })) { throw "Widget package not found" }
      - uses: actions/upload-artifact@v4
        with:
          name: canape-widget-unsigned-x64
          path: target/widget/
          if-no-files-found: error

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get install -y libxkbcommon-dev libfontconfig1-dev
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
