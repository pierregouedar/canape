name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # Release binaries built here, since Smart App Control on the Ally
      # blocks fresh build scripts (see docs/m2-report.md).
      - run: cargo build --release -p canape-shell -p canape-service -p canape-ctl
      # The GPU executable is built apart, without the software renderer.
      - run: cargo build --release -p canape-shell --no-default-features --features gpu
      - uses: actions/upload-artifact@v4
        with:
          name: canape-windows-x64
          path: |
            target/release/canape-shell.exe
            target/release/canape-shell-gpu.exe
            target/release/canape-service.exe
            target/release/canape-ctl.exe

  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: sudo apt-get install -y libxkbcommon-dev libfontconfig1-dev
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
