[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/pierregouedar/canape"

[workspace.dependencies]
canape-core = { path = "crates/canape-core" }
canape-hw = { path = "crates/canape-hw" }
canape-autotdp = { path = "crates/canape-autotdp" }
canape-ipc = { path = "crates/canape-ipc" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
windows-sys = "0.61"
windows-service = "0.8"

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
